<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            width: 300px;
            margin: 40px auto;
        }
        .cell {
            background-color: #f0f0f0;
            padding: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .cell:hover {
            background-color: #ccc;
        }
        #result {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .dark-mode {
            background-color: #333;
            color: #fff;
        }
        .dark-mode #game-board {
            background-color: #444;
        }
        .dark-mode .cell {
            background-color: #555;
        }
        .dark-mode .cell:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="result"></div>
    <div id="game-board">
        <button class="cell" id="cell-0"></button>
        <button class="cell" id="cell-1"></button>
        <button class="cell" id="cell-2"></button>
        <button class="cell" id="cell-3"></button>
        <button class="cell" id="cell-4"></button>
        <button class="cell" id="cell-5"></button>
        <button class="cell" id="cell-6"></button>
        <button class="cell" id="cell-7"></button>
        <button class="cell" id="cell-8"></button>
    </div>
    <button id="dark-mode-toggle">Toggle Dark Mode</button>
    <script>
        let currentPlayer = 'X';
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let gameOver = false;
        let darkMode = false;

        const cells = document.querySelectorAll('.cell');
        const resultDiv = document.getElementById('result');
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const body = document.body;

        cells.forEach((cell, index) => {
            cell.addEventListener('click', () => {
                if (gameOver) return;
                if (gameBoard[index] !== '') return;

                gameBoard[index] = currentPlayer;
                cell.textContent = currentPlayer;

                checkForWin();
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            });
        });

        darkModeToggle.addEventListener('click', () => {
            darkMode = !darkMode;
            if (darkMode) {
                body.classList.add('dark-mode');
            } else {
                body.classList.remove('dark-mode');
            }
        });

        function checkForWin() {
            const winConditions = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            for (let i = 0; i < winConditions.length; i++) {
                const condition = winConditions[i];
                if (gameBoard[condition[0]] !== '' &&
                    gameBoard[condition[0]] === gameBoard[condition[1]] &&
                    gameBoard[condition[0]] === gameBoard[condition[2]]) {
                    resultDiv.textContent = `Player ${gameBoard[condition[0]]} wins!`;
                    gameOver = true;
                    return;
                }
            }

            if (!gameBoard.includes('')) {
                resultDiv.textContent = 'It\'s a tie!';
                gameOver = true;
            }
        }
    </script>
</body>
</html>
